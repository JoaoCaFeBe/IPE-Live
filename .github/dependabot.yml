version: 2
updates:
  - package-ecosystem: npm
    directory: "/Liturgia"
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: sunday
      time: "05:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    groups:
      dependencias-compativeis:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/live"
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: sunday
      time: "05:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    groups:
      dependencias-compativeis:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
